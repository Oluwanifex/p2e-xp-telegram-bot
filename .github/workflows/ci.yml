name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m py_compile bot.py test_bot.py smoke_test.py
      - name: Run unit tests
        run: python test_bot.py
      - name: Validate Railway files
        run: test -s Dockerfile && test -s railway.toml && grep -q 'DOCKERFILE' railway.toml
